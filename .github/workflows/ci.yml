name: ECDAT CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecdat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecdat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov httpx2

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q .

      - name: Apply database migrations
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
          ECDAT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecdat_test
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          ECDAT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecdat_test
        run: python -m pytest -q backend/tests backend/test_*.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
